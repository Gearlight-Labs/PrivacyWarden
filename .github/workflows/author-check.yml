name: Commit Author Check

on:
  pull_request:
    branches: [main]

jobs:
  check-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all commit authors
        run: |
          ALLOWED_EMAIL="199305568+Gearlight-Labs@users.noreply.github.com"
          FAILED=0

          while IFS= read -r line; do
            sha=$(echo "$line" | awk '{print $1}')
            author_email=$(echo "$line" | awk '{print $2}')
            committer_email=$(echo "$line" | awk '{print $3}')

            if [ "$committer_email" = "noreply@github.com" ]; then
              continue
            fi

            if [ "$author_email" != "$ALLOWED_EMAIL" ]; then
              echo "❌ Commit $sha has unexpected author email: $author_email"
              FAILED=1
            fi
          done < <(git log origin/main..HEAD --format="%H %ae %ce")

          if [ "$FAILED" -eq 1 ]; then
            echo "One or more commits have unauthorized author emails."
            echo "All commits must be authored by: $ALLOWED_EMAIL"
            exit 1
          fi

          echo "✅ All commits authored by $ALLOWED_EMAIL"
