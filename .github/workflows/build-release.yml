name: Build and Release StreamGuard

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.1.1)'
        required: true
        default: '1.1.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Determine version string early so every subsequent step can use it.
      # On a tag push: strip the leading 'v' from the tag name (v1.2.0 → 1.2.0).
      # On workflow_dispatch: use the manually supplied input.
      - name: Determine version string
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      - name: Restore dependencies
        run: |
          dotnet restore src/StreamGuard/StreamGuard.csproj
          dotnet restore src/StreamGuardTray/StreamGuardTray.csproj

      # Framework-dependent builds: SelfContained=false keeps exe small (~5-8 MB).
      # .NET 8 ships with Windows 10/11 via Windows Update, so users already have it.
      - name: Build StreamGuard service
        run: |
          dotnet publish src/StreamGuard/StreamGuard.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o build/service

      - name: Build StreamGuardTray
        run: |
          dotnet publish src/StreamGuardTray/StreamGuardTray.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o build/tray

      - name: Decode and import code signing certificate
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:CODE_SIGN_CERT)
          [System.IO.File]::WriteAllBytes("$env:TEMP\codesign.pfx", $certBytes)
          Write-Host "Certificate decoded successfully"

      - name: Sign executables
        env:
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          # Explicitly find x64 signtool — the default recursive search can return
          # the ARM64 binary first, which fails on x64 runners.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" `
            | Where-Object { $_.FullName -like "*\x64\*" } `
            | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "Could not find x64 signtool.exe"
          }
          Write-Host "Using signtool: $signtool"

          & $signtool sign `
            /f "$env:TEMP\codesign.pfx" `
            /p $env:CODE_SIGN_PASSWORD `
            /fd SHA256 `
            /d "StreamGuard — VPN Privacy Manager" `
            /du "https://gearlight-labs.github.io/StreamGuard/" `
            /t "http://timestamp.digicert.com" `
            /v `
            "build/service/StreamGuard.exe" `
            "build/tray/StreamGuardTray.exe"

      # Windows Server 2025 runners no longer ship NSIS pre-installed.
      # Download directly from SourceForge and add to PATH — same approach
      # used by gauge, electron-builder, and other projects after the runner change.
      - name: Install NSIS
        env:
          NSIS_VERSION: '3.11'
        run: |
          Invoke-WebRequest `
            "https://sourceforge.net/projects/nsis/files/NSIS%203/${env:NSIS_VERSION}/nsis-${env:NSIS_VERSION}.zip/download" `
            -UserAgent "PowerShell" `
            -OutFile "./nsis.zip"
          Expand-Archive -LiteralPath ./nsis.zip -DestinationPath "${env:ProgramFiles(x86)}"
          # Also extract the 8k-strings variant on top for large scripts
          Invoke-WebRequest `
            "https://sourceforge.net/projects/nsis/files/NSIS%203/${env:NSIS_VERSION}/nsis-${env:NSIS_VERSION}-strlen_8192.zip/download" `
            -UserAgent "PowerShell" `
            -OutFile "./nsis-8192.zip"
          Expand-Archive -Force -LiteralPath ./nsis-8192.zip -DestinationPath "${env:ProgramFiles(x86)}\nsis-${env:NSIS_VERSION}"
          # Add to PATH for all subsequent steps
          echo "${env:ProgramFiles(x86)}\nsis-${env:NSIS_VERSION}" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "NSIS installed at: ${env:ProgramFiles(x86)}\nsis-${env:NSIS_VERSION}"

      - name: Copy assets for installer
        run: |
          New-Item -ItemType Directory -Force -Path StreamGuard_Release
          Copy-Item "build/service/StreamGuard.exe"     "StreamGuard_Release/"
          Copy-Item "build/tray/StreamGuardTray.exe"    "StreamGuard_Release/"
          Copy-Item "src/StreamGuardTray/tray_icon.ico" "StreamGuard_Release/"
          Copy-Item "docs/USER_GUIDE.md"                "StreamGuard_Release/"
          Copy-Item "docs/FAQ.md"                       "StreamGuard_Release/"
          Copy-Item "docs/SECURITY.md"                  "StreamGuard_Release/"
          Copy-Item "LICENSE"                           "StreamGuard_Release/"
          Copy-Item "CHANGELOG.md"                      "StreamGuard_Release/" -ErrorAction SilentlyContinue
          Write-Host "Release folder contents:"
          Get-ChildItem StreamGuard_Release

      - name: Build NSIS installer
        run: |
          # Run makensis from the repo root so that relative paths in the .nsi
          # script (e.g. ..\StreamGuard_Release) resolve correctly.
          makensis installer\StreamGuard_Installer.nsi

      - name: Rename installer to versioned filename
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = "installer\StreamGuard-Setup-v1.1.1.exe"
          $dst = "installer\StreamGuard-Setup-v${ver}.exe"
          if ($src -ne $dst) {
            Rename-Item -Path $src -NewName "StreamGuard-Setup-v${ver}.exe"
          }
          Write-Host "Installer: $dst"

      - name: Sign installer
        env:
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" `
            | Where-Object { $_.FullName -like "*\x64\*" } `
            | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign `
            /f "$env:TEMP\codesign.pfx" `
            /p $env:CODE_SIGN_PASSWORD `
            /fd SHA256 `
            /d "StreamGuard Installer" `
            /du "https://gearlight-labs.github.io/StreamGuard/" `
            /t "http://timestamp.digicert.com" `
            /v `
            "installer\StreamGuard-Setup-v${ver}.exe"

      - name: Create release ZIP
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "StreamGuard_Release/*" -DestinationPath "StreamGuard-v${ver}-release.zip"

      - name: Compute SHA256 hashes
        run: |
          $ver       = "${{ steps.version.outputs.VERSION }}"
          $installer = (Get-FileHash "installer\StreamGuard-Setup-v${ver}.exe" -Algorithm SHA256).Hash
          $zip       = (Get-FileHash "StreamGuard-v${ver}-release.zip" -Algorithm SHA256).Hash
          @"
          StreamGuard v${ver} — SHA256 Checksums
          =======================================
          Built by GitHub Actions — verifiable from source

          StreamGuard-Setup-v${ver}.exe
            $installer

          StreamGuard-v${ver}-release.zip
            $zip
          "@ | Out-File -FilePath "SHA256.txt" -Encoding UTF8

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: streamguard-release
          path: |
            installer/StreamGuard-Setup-v${{ steps.version.outputs.VERSION }}.exe
            StreamGuard-v${{ steps.version.outputs.VERSION }}-release.zip
            SHA256.txt
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/StreamGuard-Setup-v${{ steps.version.outputs.VERSION }}.exe
            StreamGuard-v${{ steps.version.outputs.VERSION }}-release.zip
            SHA256.txt
          generate_release_notes: true
          draft: false
          prerelease: false
