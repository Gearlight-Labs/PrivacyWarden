name: Build and Release PrivacyWarden

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.3.1)'
        required: true
        default: '1.3.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Determine version string early so every subsequent step can use it.
      # On a tag push: strip the leading 'v' from the tag name (v1.3.1 → 1.3.1).
      # On workflow_dispatch: use the manually supplied input.
      - name: Determine version string
        id: version
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $ver = "${{ github.ref_name }}" -replace '^v', ''
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $ver"

      # Single project since v1.3.0 — tray is merged into PrivacyWarden.exe
      - name: Restore dependencies
        run: dotnet restore src/PrivacyWarden/PrivacyWarden.csproj

      # Framework-dependent single-file build: small (~5-8 MB), requires .NET 8 runtime.
      # .NET 8 ships with Windows 10/11 via Windows Update, so users already have it.
      - name: Build PrivacyWarden (unified service + tray)
        run: |
          dotnet publish src/PrivacyWarden/PrivacyWarden.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o build/release

      - name: Decode and import code signing certificate
        env:
          CODE_SIGN_CERT: ${{ secrets.CODE_SIGN_CERT }}
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $certBytes = [System.Convert]::FromBase64String($env:CODE_SIGN_CERT)
          [System.IO.File]::WriteAllBytes("$env:TEMP\codesign.pfx", $certBytes)
          Write-Host "Certificate decoded successfully"

      - name: Sign executable
        env:
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          # Explicitly find x64 signtool — the default recursive search can return
          # the ARM64 binary first, which fails on x64 runners.
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" `
            | Where-Object { $_.FullName -like "*\x64\*" } `
            | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "Could not find x64 signtool.exe"
          }
          Write-Host "Using signtool: $signtool"

          & $signtool sign `
            /f "$env:TEMP\codesign.pfx" `
            /p $env:CODE_SIGN_PASSWORD `
            /fd SHA256 `
            /d "PrivacyWarden — VPN Privacy Manager" `
            /du "https://github.com/Gearlight-Labs/PrivacyWarden" `
            /t "http://timestamp.digicert.com" `
            /v `
            "build/release/PrivacyWarden.exe"

      # Install NSIS via Chocolatey — avoids SourceForge SSL errors on GitHub-hosted runners.
      - name: Install NSIS
        run: |
          choco install nsis --version 3.11 -y --no-progress
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "NSIS installed."

      - name: Copy assets for installer
        run: |
          New-Item -ItemType Directory -Force -Path PrivacyWarden_Release
          Copy-Item "build/release/PrivacyWarden.exe"          "PrivacyWarden_Release/"
          Copy-Item "src/PrivacyWarden/tray_icon.ico"          "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Copy-Item "docs/USER_GUIDE.md"                       "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Copy-Item "docs/FAQ.md"                              "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Copy-Item "docs/SECURITY.md"                         "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Copy-Item "LICENSE"                                  "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Copy-Item "CHANGELOG.md"                             "PrivacyWarden_Release/" -ErrorAction SilentlyContinue
          Write-Host "Release folder contents:"
          Get-ChildItem PrivacyWarden_Release

      - name: Build NSIS installer
        run: |
          # Run makensis from the repo root so that relative paths in the .nsi
          # script (e.g. ..\PrivacyWarden_Release) resolve correctly.
          makensis installer\PrivacyWarden_Installer.nsi

      - name: Rename installer to versioned filename
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $src = "installer\PrivacyWarden-Setup-v1.3.1.exe"
          $dst = "installer\PrivacyWarden-Setup-v${ver}.exe"
          if (Test-Path $src) {
            if ($src -ne $dst) {
              Rename-Item -Path $src -NewName "PrivacyWarden-Setup-v${ver}.exe"
            }
          } else {
            # NSIS names the output using PRODUCT_VERSION from the .nsi file
            $existing = Get-ChildItem "installer\PrivacyWarden-Setup-*.exe" | Select-Object -First 1
            if ($existing -and $existing.FullName -ne $dst) {
              Rename-Item -Path $existing.FullName -NewName "PrivacyWarden-Setup-v${ver}.exe"
            }
          }
          Write-Host "Installer: $dst"

      - name: Sign installer
        env:
          CODE_SIGN_PASSWORD: ${{ secrets.CODE_SIGN_PASSWORD }}
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter "signtool.exe" `
            | Where-Object { $_.FullName -like "*\x64\*" } `
            | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign `
            /f "$env:TEMP\codesign.pfx" `
            /p $env:CODE_SIGN_PASSWORD `
            /fd SHA256 `
            /d "PrivacyWarden Installer" `
            /du "https://github.com/Gearlight-Labs/PrivacyWarden" `
            /t "http://timestamp.digicert.com" `
            /v `
            "installer\PrivacyWarden-Setup-v${ver}.exe"

      - name: Create release ZIP
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          Compress-Archive -Path "PrivacyWarden_Release/*" -DestinationPath "PrivacyWarden-v${ver}-release.zip"

      - name: Compute SHA256 hashes
        run: |
          $ver       = "${{ steps.version.outputs.VERSION }}"
          $installer = (Get-FileHash "installer\PrivacyWarden-Setup-v${ver}.exe" -Algorithm SHA256).Hash
          $zip       = (Get-FileHash "PrivacyWarden-v${ver}-release.zip" -Algorithm SHA256).Hash
          $lines = @(
            "PrivacyWarden v${ver} - SHA256 Checksums",
            "=======================================",
            "Built by GitHub Actions - verifiable from source",
            "",
            "PrivacyWarden-Setup-v${ver}.exe",
            "  $installer",
            "",
            "PrivacyWarden-v${ver}-release.zip",
            "  $zip"
          )
          [System.IO.File]::WriteAllText("SHA256.txt", ($lines -join "`n"), [System.Text.Encoding]::UTF8)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privacywarden-release
          path: |
            installer/PrivacyWarden-Setup-v${{ steps.version.outputs.VERSION }}.exe
            PrivacyWarden-v${{ steps.version.outputs.VERSION }}-release.zip
            SHA256.txt
          retention-days: 90

      - name: Create GitHub Release (on tag push)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/PrivacyWarden-Setup-v${{ steps.version.outputs.VERSION }}.exe
            PrivacyWarden-v${{ steps.version.outputs.VERSION }}-release.zip
            SHA256.txt
          generate_release_notes: false
          draft: false
          prerelease: false
