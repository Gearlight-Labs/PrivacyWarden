      - id: THR11
        name: "Integrate Steven Black's hosts list"
        description: "Downloads and integrates Steven Black's consolidated hosts file for ad/malware blocking. Defaults to the safe base variant (ads + malware only). More aggressive variants are available but may break legitimate sites."
        recommend: standard,streamer,vtuber,paranoid
        risk: medium
        caution: |
          IMPORTANT: Only the base variant (ads + malware) is applied by default.
          The fakenews, gambling, and porn variants block entire site categories and WILL
          break legitimate websites in those categories. Do not enable those variants unless
          you fully understand the impact. A backup of your original hosts file is created
          automatically. Requires internet access and may slow DNS slightly on older systems.
        docs: |
          Steven Black's consolidated hosts file aggregates multiple reputable blocklists.
          Available variants (choose ONE — they are cumulative):

          SAFE (default):
            Base (ads + malware only) — ~83,000 domains
            https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts

          AGGRESSIVE (may break legitimate sites — use with caution):
            + Fakenews — adds fake news sites
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews/hosts
            + Gambling — adds gambling sites (breaks ALL gambling sites incl. legal ones)
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/gambling/hosts
            + Porn — adds adult content (breaks ALL adult sites)
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/porn/hosts
            + Fakenews + Gambling
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling/hosts
            + Fakenews + Gambling + Porn
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-gambling-porn/hosts
            + Fakenews + Porn
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/fakenews-porn/hosts
            + Gambling + Porn
            https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/gambling-porn/hosts

          Each variant also has a jsDelivr CDN mirror as fallback:
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/hosts (base)
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/fakenews/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/gambling/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/porn/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/fakenews-gambling/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/fakenews-gambling-porn/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/fakenews-porn/hosts
            https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/gambling-porn/hosts

          [1]: https://github.com/StevenBlack/hosts "StevenBlack/hosts: Consolidating and extending hosts files from several well-curated sources"
        call:
          function: RunPowerShell
          parameters:
            code: |
              # ── Steven Black's hosts list ─────────────────────────────────────────────
              # DEFAULT: Base variant (ads + malware only) — safe for all users.
              # To use a different variant, comment out the $__variant line below and
              # uncomment the one you want. WARNING: non-base variants block entire site
              # categories and WILL break legitimate websites in those categories.
              #
              # Available variants:
              #   ""                         = Base: ads + malware only (~83,000 domains) [DEFAULT - SAFE]
              #   "fakenews"                 = + Fake news sites [AGGRESSIVE]
              #   "gambling"                 = + Gambling sites — breaks ALL gambling sites [AGGRESSIVE]
              #   "porn"                     = + Adult content — breaks ALL adult sites [AGGRESSIVE]
              #   "fakenews-gambling"        = + Fake news + Gambling [AGGRESSIVE]
              #   "fakenews-gambling-porn"   = + Fake news + Gambling + Porn [AGGRESSIVE]
              #   "fakenews-porn"            = + Fake news + Porn [AGGRESSIVE]
              #   "gambling-porn"            = + Gambling + Porn [AGGRESSIVE]
              #
              $__variant = ""  # <-- Change this to use a different variant (see above)
              #
              # ─────────────────────────────────────────────────────────────────────────

              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__backupPath = "$__hostsPath.privacywarden.bak"
              if (-not (Test-Path $__backupPath)) {
                Copy-Item $__hostsPath $__backupPath -Force
                Write-Host "    [INFO] Hosts file backed up to $__backupPath" -ForegroundColor Cyan
              }

              # Build URLs: GitHub primary + jsDelivr CDN fallback for the selected variant
              if ($__variant -eq "") {
                $__ghUrl  = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
                $__cdnUrl = "https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/hosts"
                $__label  = "Base (ads + malware)"
              } else {
                $__ghUrl  = "https://raw.githubusercontent.com/StevenBlack/hosts/master/alternates/$__variant/hosts"
                $__cdnUrl = "https://cdn.jsdelivr.net/gh/StevenBlack/hosts@master/alternates/$__variant/hosts"
                $__label  = "$__variant variant"
              }

              $__urls = @($__ghUrl, $__cdnUrl)
              $__success = $false
              foreach ($__url in $__urls) {
                for ($__i = 0; $__i -lt 3; $__i++) {
                  try {
                    Write-Host "    Downloading Steven Black's hosts list [$__label] (attempt $($__i+1)/3)..." -ForegroundColor Yellow
                    $__content = (Invoke-WebRequest -Uri $__url -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop).Content
                    $__marker = "# PrivacyWarden-StevenBlack"
                    $__existing = [System.IO.File]::ReadAllText($__hostsPath)
                    if ($__existing -notmatch [regex]::Escape($__marker)) {
                      [System.IO.File]::AppendAllText($__hostsPath, "`r`n$__marker`r`n$__content")
                    } else {
                      Write-Host "    [INFO] Steven Black's list already present — skipping duplicate append." -ForegroundColor Cyan
                    }
                    Write-Host "    [OK] Steven Black's hosts list [$__label] integrated successfully" -ForegroundColor Green
                    $__success = $true
                    break
                  } catch {
                    if ($__i -lt 2) { Start-Sleep -Seconds 5 }
                  }
                }
                if ($__success) { break }
              }
              if (-not $__success) {
                Write-Host "    [WARNING] Could not download Steven Black's list after all attempts. Skipping." -ForegroundColor Yellow
              }
            checkCode: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__content = [System.IO.File]::ReadAllText($__hostsPath)
              if ($__content -match "PrivacyWarden-StevenBlack") {
                Write-Host "    [OK] Steven Black's hosts list is integrated" -ForegroundColor Green
              } else {
                Write-Host "    [MISSING] Steven Black's hosts list is not integrated" -ForegroundColor Yellow
              }
            revertCode: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__backupPath = "$__hostsPath.privacywarden.bak"
              if (Test-Path $__backupPath) {
                Copy-Item $__backupPath $__hostsPath -Force
                Write-Host "    [OK] Hosts file restored from PrivacyWarden backup" -ForegroundColor Green
              } else {
                $__lines = [System.IO.File]::ReadAllLines($__hostsPath)
                $__filtered = $__lines | Where-Object { $_ -notmatch "PrivacyWarden-StevenBlack" }
                [System.IO.File]::WriteAllLines($__hostsPath, $__filtered)
                Write-Host "    [OK] Steven Black's hosts list removed" -ForegroundColor Green
              }

      - id: THR12
        recommend: streamer,vtuber,paranoid
        risk: medium
        name: "Block Stalkerware C2 Infrastructure"
        category: threat
        description: |
          Blocks the command-and-control (C2) servers and distribution sites for the most widely deployed
          stalkerware applications — FlexiSPY, mSpy, Hoverwatch, Cerberus, Cocospy, uMobix, ClevGuard,
          SpyEra, iKeyMonitor, HighsterMobile, WebWatcher, SpyMasterPro, and Spynger.
          Stalkerware is commercial spyware marketed as "parental controls" or "employee monitoring"
          but is routinely used for intimate partner surveillance. Blocking their C2 domains prevents
          any installed stalkerware agent from phoning home, exfiltrating data, or receiving commands.
          This is especially relevant for streamers and VTubers who share devices or have been targeted
          by harassment campaigns that escalate to physical surveillance.
        caution: |
          This step blocks domains at the Windows hosts file level. It will not remove any stalkerware
          already installed on the device — use a dedicated anti-stalkerware scanner (e.g., Malwarebytes,
          Certo Mobile Security) for removal. Some entries (e.g., umeng analytics) may affect unrelated
          Chinese apps that bundle the same SDK.
        docs: |
          Stalkerware indicators sourced from AssoEchap/stalkerware-indicators (CC0 license) [1],
          a community-maintained IOC database used by Kaspersky, ESET, and the Coalition Against Stalkerware.
          [1]: https://github.com/AssoEchap/stalkerware-indicators "AssoEchap/stalkerware-indicators on GitHub"
        call:
          function: RunPowerShell
          parameters:
            code: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__marker = "# PrivacyWarden THR12 - Stalkerware C2 Block"
              $__domains = @(
                "flexispy.com","www.flexispy.com","admin.flexispy.com","api.flexispy.com",
                "community.flexispy.com","mobilefonex.com","client.mobilefonex.com","djp.bz","dmw.bz",
                "mspy.com","cart.mspy.com","bill-msp.app","ctrl-msp.app",
                "a.thd.cc","a-qa3.thd.cc","api.thd.cc","alter757.info","kidsecured.com","freefonespy.com",
                "hoverwatch.com","dev.hoverwatch.com","hw.cab","a.hw.cab","a.hwa.cab",
                "refog.com","account.refog.com","highstermobi.com",
                "cerberusapp.com","www.cerberusapp.com","enterprise.cerberusapp.com","cerberusbrasil.com",
                "cocospy.com","cocospy.net","spyic.com","minspy.com","fonemonitor.co",
                "umobix.com","n.umobix.com","tt.umobix.com","android-api.umobix.com","us.umobix.com","spyfer.info",
                "clevguard.com","www.clevguard.com","clevguard.net","panel.clevguard.com","api.clevguard.com",
                "spyera.com","spylogs.com","login.spylogs.com","support.spyera.com",
                "easemon.com","awsapi.io","em.awsapi.io","ikm.awsapi.io","emcpanel.com",
                "auto-forward.com","autoforward.app","autoforward.co",
                "webwatcher.com","www.webwatcher.com","awarenesstechnologies.com","interguardsoftware.com",
                "api.awarenesstechnologies.com","data.webwatcherdata.com",
                "spymasterpro.com","www.spymasterpro.com","imobispy.com",
                "spynger.net","cart.spynger.net","my.spynger.net","ios-gw.spynger.net",
                "copy9.com","my.copy9.com","guestspy.com","exactspy.com",
                "fonetracker.com","ispyoo.com","thetruthspy.com","thespyapp.com",
                "mxspy.com","www.mxspy.com","phonespying.com","phonetracking.net",
                "mobilespyonline.com","secondclone.com","spyapps.net","spycell.net",
                "xnspy.pro","us.xnspy.pro","xpspy.com","inospy.com","hespyapp.com",
                "innoaspy.com","mobidad.app","phoneparental.com","weysys.com",
                "spyzie.com","app-api.spyzie.com",
                "android-monitor.ru","anmon.ru","anmon.su","anmon.name","androidspy.info",
                "eyezy.com","moniterro.com"
              )
              $__current = Get-Content $__hostsPath -Raw -ErrorAction SilentlyContinue
              if ($__current -match [regex]::Escape($__marker)) {
                Write-Host "    [OK] Stalkerware C2 block already applied" -ForegroundColor Green
              } else {
                $__lines = "`n$__marker`n"
                foreach ($__d in $__domains) { $__lines += "0.0.0.0 $__d`n" }
                Add-Content -Path $__hostsPath -Value $__lines -Encoding UTF8
                Write-Host "    [OK] Blocked $($__domains.Count) stalkerware C2 domains" -ForegroundColor Green
              }
            checkCode: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__marker = "# PrivacyWarden THR12 - Stalkerware C2 Block"
              $__current = Get-Content $__hostsPath -Raw -ErrorAction SilentlyContinue
              if ($__current -match [regex]::Escape($__marker)) {
                Write-Host "    [OK] Stalkerware C2 block is active" -ForegroundColor Green
              } else {
                Write-Host "    [MISSING] Stalkerware C2 block not found in hosts file" -ForegroundColor Red
              }
            revertCode: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
              $__marker = "# PrivacyWarden THR12 - Stalkerware C2 Block"
              $__lines = Get-Content $__hostsPath -ErrorAction SilentlyContinue
              if ($__lines) {
                $__inBlock = $false
                $__newLines = @()
                foreach ($__line in $__lines) {
                  if ($__line -match [regex]::Escape($__marker)) { $__inBlock = $true }
                  if (-not $__inBlock) { $__newLines += $__line }
                  if ($__inBlock -and $__line.Trim() -eq "") { $__inBlock = $false }
                }
                Set-Content -Path $__hostsPath -Value $__newLines -Encoding UTF8
                Write-Host "    [OK] Stalkerware C2 block removed from hosts file" -ForegroundColor Green
              }
  - category: "Advanced Hardening"
    children:

      - id: ADV09
        name: "Enable TPM 2.0 verification"
        description: "Verifies TPM 2.0 is active and configured for BitLocker and Windows 11 security features."
        recommend: streamer,vtuber,paranoid
        risk: low
        docs: |
          TPM 2.0 (Trusted Platform Module) provides hardware-based security for BitLocker
          encryption and Windows Hello. Required for Windows 11 and modern security features [1].

          [1]: https://docs.microsoft.com/en-us/windows/security/information-protection/tpm/tpm-fundamentals "TPM Fundamentals | Microsoft Docs"
        call:
          function: RunPowerShell
          parameters:
            code: |
              try {
                $__tpm = Get-Tpm -ErrorAction Stop
                if ($__tpm.TpmPresent -and $__tpm.TpmEnabled) {
                  Write-Host "    [OK] TPM 2.0 is present and enabled" -ForegroundColor Green
                } else {
                  Write-Host "    [WARNING] TPM is not present or not enabled. Enable in BIOS/UEFI." -ForegroundColor Yellow
                }
              } catch {
                Write-Host "    [WARNING] Could not query TPM status: $_" -ForegroundColor Yellow
              }
            checkCode: |
              try {
                $__tpm = Get-Tpm -ErrorAction Stop
                if ($__tpm.TpmPresent -and $__tpm.TpmEnabled) {
                  Write-Host "    [OK] TPM 2.0 is present and enabled" -ForegroundColor Green
                } else {
                  Write-Host "    [MISSING] TPM is not present or not enabled" -ForegroundColor Yellow
                }
              } catch {
                Write-Host "    [MISSING] Could not query TPM status" -ForegroundColor Yellow
              }
            revertCode: |
              Write-Host "    [INFO] TPM configuration is managed in BIOS/UEFI — no software revert available." -ForegroundColor Cyan

      - id: ADV10
        name: "Clean Discord token grabber artifacts"
        description: "Removes Discord token grabber malware remnants from common installation locations."
        recommend: streamer,vtuber,paranoid
        risk: medium
        caution: |
          This step scans and removes files matching known token grabber patterns.
          Review the list of removed files before running if you have custom scripts in these locations.
        docs: |
          Discord token grabbers steal authentication tokens from the Discord client's local storage,
          allowing attackers to take over accounts without needing passwords [1].

          [1]: https://attack.mitre.org/techniques/T1539/ "T1539: Steal Web Session Cookie | MITRE ATT&CK"
        call:
          function: RunPowerShell
          parameters:
            code: |
              $__discordPaths = @(
                "$env:APPDATA\discord\",
                "$env:LOCALAPPDATA\Discord\"
              )
              $__suspiciousPatterns = @("*.exe", "*.bat", "*.vbs", "*.ps1")
              # Precise allowlist of every legitimate Discord-shipped executable and helper
              $__knownGood = @(
                "Discord.exe", "Update.exe", "SquirrelSetup.exe",
                "audio_effects_helper.exe",
                "gpu_encoder_helper.exe",
                "chrome_crashpad_handler.exe",
                "crashpad_handler.exe"
              )
              $__found = 0
              foreach ($__path in $__discordPaths) {
                if (Test-Path $__path) {
                  foreach ($__pattern in $__suspiciousPatterns) {
                    $__files = Get-ChildItem -Path $__path -Filter $__pattern -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $__knownGood -notcontains $_.Name }
                    foreach ($__file in $__files) {
                      Write-Host "    [FOUND] Suspicious file: $($__file.FullName)" -ForegroundColor Yellow
                      Remove-Item $__file.FullName -Force -ErrorAction SilentlyContinue
                      $__found++
                    }
                  }
                }
              }
              if ($__found -gt 0) {
                Write-Host "    [OK] Removed $__found suspicious Discord artifact(s)" -ForegroundColor Green
              } else {
                Write-Host "    [OK] No Discord token grabber artifacts found" -ForegroundColor Green
              }
            checkCode: |
              $__discordPaths = @(
                "$env:APPDATA\discord\",
                "$env:LOCALAPPDATA\Discord\"
              )
              $__suspiciousPatterns = @("*.exe", "*.bat", "*.vbs", "*.ps1")
              $__knownGood = @(
                "Discord.exe", "Update.exe", "SquirrelSetup.exe",
                "audio_effects_helper.exe",
                "gpu_encoder_helper.exe",
                "chrome_crashpad_handler.exe",
                "crashpad_handler.exe"
              )
              $__found = 0
              foreach ($__path in $__discordPaths) {
                if (Test-Path $__path) {
                  foreach ($__pattern in $__suspiciousPatterns) {
                    $__files = Get-ChildItem -Path $__path -Filter $__pattern -Recurse -ErrorAction SilentlyContinue |
                      Where-Object { $__knownGood -notcontains $_.Name }
                    $__found += $__files.Count
                  }
                }
              }
              if ($__found -eq 0) {
                Write-Host "    [OK] No Discord token grabber artifacts found" -ForegroundColor Green
              } else {
                Write-Host "    [MISSING] Found $__found suspicious Discord artifact(s)" -ForegroundColor Yellow
              }
            revertCode: |
              Write-Host "    [INFO] Removed artifacts cannot be restored. No revert available." -ForegroundColor Cyan


