      - id: THR11
        name: "Block 83,599 malicious domains (Steven Black's hosts)"
        description: "Integrates Steven Black's comprehensive hosts list: malware, adware, tracking, phishing, and harassment domains."
        recommend: standard
        docs:
          - "https://github.com/StevenBlack/hosts"
        code: |
          $hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
          $backupPath = "$hostsPath.bak"
          if (-not (Test-Path $backupPath)) { Copy-Item $hostsPath $backupPath -Force }
          $stevenBlackUrl = "https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts"
          for ($i = 0; $i -lt 3; $i++) {
            try {
              Write-Host "    Downloading Steven Black's hosts list (attempt $($i+1)/3)..." -ForegroundColor Yellow
              $content = Invoke-WebRequest -Uri $stevenBlackUrl -UseBasicParsing -TimeoutSec 30 -ErrorAction Stop | Select-Object -ExpandProperty Content
              Add-Content -Path $hostsPath -Value "`n# Steven Black's hosts list - https://github.com/StevenBlack/hosts"
              Add-Content -Path $hostsPath -Value $content
              Write-Host "    [OK] Steven Black's hosts list integrated (83,599 domains blocked)" -ForegroundColor Green
              break
            } catch {
              if ($i -lt 2) { Start-Sleep -Seconds 5 }
              else { Write-Host "    [WARNING] Could not download Steven Black's list after 3 attempts. Continuing..." -ForegroundColor Yellow }
            }
          }
        checkCode: |
          $hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
          $content = Get-Content $hostsPath -Raw -ErrorAction SilentlyContinue
          if ($content -like "*Steven Black*") { Write-Host "    [OK] Steven Black's hosts list is integrated" -ForegroundColor Green }
          else { Write-Host "    [MISSING] Steven Black's hosts list is not integrated" -ForegroundColor Yellow }
        revertCode: |
          $hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
          $backupPath = "$hostsPath.bak"
          if (Test-Path $backupPath) { Copy-Item $backupPath $hostsPath -Force; Write-Host "    [OK] Hosts file restored from backup" -ForegroundColor Green }
          else { Write-Host "    [WARNING] No backup found" -ForegroundColor Yellow }
