  # ============================================================
  - category: Exploit Mitigations
    description: "Enables Controlled Folder Access, disables remote access services, and removes high-risk attack surfaces."
    children:

      - id: ADV01
        name: "Enable Controlled Folder Access"
        description: "Protects critical folders from ransomware — only approved apps can modify them."
        recommend: standard
        code: |
          Set-MpPreference -EnableControlledFolderAccess Enabled -ErrorAction SilentlyContinue
          Write-Host "    [OK] Controlled Folder Access enabled" -ForegroundColor Green
        checkCode: |
          $cfa = Get-MpPreference -ErrorAction SilentlyContinue
          if ($cfa.EnableControlledFolderAccess -eq 1) { Write-Host "    [OK] Controlled Folder Access is enabled" -ForegroundColor Green }
          else { Write-Host "    [MISSING] Controlled Folder Access is not enabled (value: $($cfa.EnableControlledFolderAccess))" -ForegroundColor Yellow }
        revertCode: |
          Set-MpPreference -EnableControlledFolderAccess Disabled -ErrorAction SilentlyContinue
          Write-Host "    [OK] Controlled Folder Access disabled" -ForegroundColor Green

      - id: ADV02
        name: "Disable Remote Registry"
        description: "Prevents remote registry access — blocks lateral movement attacks."
        recommend: standard
        code: |
          Set-Service RemoteRegistry -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service RemoteRegistry -Force -ErrorAction SilentlyContinue
          Write-Host "    [OK] Remote Registry disabled" -ForegroundColor Green
        checkCode: |
          $rr = Get-Service RemoteRegistry -ErrorAction SilentlyContinue
          if ($rr.StartupType -eq "Disabled") { Write-Host "    [OK] Remote Registry is disabled" -ForegroundColor Green }
          else { Write-Host "    [MISSING] Remote Registry is not disabled" -ForegroundColor Yellow }
        revertCode: |
          Set-Service RemoteRegistry -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service RemoteRegistry -ErrorAction SilentlyContinue
          Write-Host "    [OK] Remote Registry reverted" -ForegroundColor Green

      - id: ADV03
        name: "Disable WinRM (Remote Management)"
        description: "Removes Windows Remote Management — blocks PowerShell-based lateral movement."
        recommend: standard
        code: |
          Disable-PSRemoting -Force -ErrorAction SilentlyContinue
          Set-Service WinRM -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service WinRM -Force -ErrorAction SilentlyContinue
          Write-Host "    [OK] WinRM disabled" -ForegroundColor Green
        checkCode: |
          $winrm = Get-Service WinRM -ErrorAction SilentlyContinue
          if ($winrm.StartupType -eq "Disabled") { Write-Host "    [OK] WinRM is disabled" -ForegroundColor Green }
