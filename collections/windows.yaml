                "kiwifarms.md",
                "kiwifarms.rs",
                "kiwifarms.ba",
                "kiwifarms.mk",
                "kiwifarms.al",
                "kiwifarms.me",
                "kiwifarms.xn--p1ai",
                # KiwiFarms onion/alternative access domains (clearnet proxies)
                "kiwifarms.onion.pet",
                "kiwifarms.onion.ws",
                "kiwifarms.onion.ly",
                # Associated lolcow/harassment boards
                "lolcow.farm",
                "lolcow.net",
                "lolcow.org",
                "lolcow.co",
                "lolcow.club",
                "lolcow.wiki",
                # CWCki (harassment wiki)
                "cwcki.com",
                "cwcki.net",
                # Keffals-era mirrors and related
                "kiwifarms.fi",
                "kiwifarms.gg"
              )
              $__added = 0
              foreach ($__domain in $__domains) {
                if ($__hostsContent -notmatch [regex]::Escape($__domain)) {
                  [System.IO.File]::AppendAllText($__hostsPath, "`r`n0.0.0.0 $__domain  # PrivacyWarden-Harassment")
                  $__hostsContent += "`r`n0.0.0.0 $__domain  # PrivacyWarden-Harassment"
                  $__added++
                }
              }
              Write-Host "    [OK] KiwiFarms/stalkerware/harassment blocking applied ($__added new domains)" -ForegroundColor Green
            checkCode: |
              $__hostsPath = "$env:SystemRoot\System32\drivers\etc\hosts"
